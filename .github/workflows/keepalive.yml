# =====================================================================
# Keep-alive fuer das Supabase-Projekt
#
# Der kostenlose Supabase-Tarif pausiert Projekte, die laut Supabase
# "nicht genug Aktivitaet" haben (Pruefzeitraum 7 Tage).
#
# Erfahrung vom 20.10.2026: Ein einzelner lesender Aufruf alle 3 Tage
# hat NICHT gereicht, das Projekt wurde trotzdem pausiert. Deshalb jetzt:
#   - taeglich statt alle 3 Tage
#   - mehrere verschiedene Aufrufe (Datenbank, REST-API, Auth)
#   - ping() schreibt seit Migration 0010 einen Zeitstempel in die
#     Datenbank (echte Schreibaktivitaet)
#
# Vorher einmalig in GitHub einrichten:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL        z. B. https://abcdefghij.supabase.co
#     SUPABASE_ANON_KEY   der oeffentliche Schluessel aus index.html
#                         (Format sb_publishable_... oder eyJ...)
#
# Hinweis: GitHub schaltet geplante Ablaeufe ab, wenn 60 Tage lang
# niemand etwas am Repository aendert. Der Ablauf laesst sich dann unter
# "Actions" mit "Run workflow" wieder von Hand starten.
# =====================================================================

name: Keep-alive Supabase

on:
  schedule:
    # Minute Stunde Tag Monat Wochentag -> taeglich um 06:17 UTC
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supabase-Projekt ansprechen
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${URL}" ] || [ -z "${KEY}" ]; then
            echo "::error::Die Secrets SUPABASE_URL und SUPABASE_ANON_KEY fehlen."
            exit 1
          fi

          # Abschliessenden Schraegstrich entfernen, falls vorhanden
          BASIS="${URL%/}"

          # aufruf <Name> <Methode> <Pfad> [Body]  -> setzt STATUS
          aufruf () {
            local name="$1" methode="$2" pfad="$3" body="${4:-}"
            local args=(--silent --show-error --output antwort.txt
                        --write-out "%{http_code}"
                        --retry 3 --retry-delay 15 --retry-all-errors
                        --max-time 40
                        -X "${methode}" "${BASIS}${pfad}"
                        -H "apikey: ${KEY}"
                        -H "Authorization: Bearer ${KEY}")
            if [ -n "${body}" ]; then
              args+=(-H "Content-Type: application/json" -d "${body}")
            fi
            STATUS=$(curl "${args[@]}" || true)
            echo "${name}: HTTP ${STATUS}"
          }

          # 1) Datenbankfunktion ping() -- schreibt seit Migration 0010
          aufruf "ping()" POST /rest/v1/rpc/ping '{}'
          PING_STATUS="${STATUS}"
          if [ "${PING_STATUS}" = "200" ]; then
            cat antwort.txt; echo
          fi

          # 2) REST-API und 3) Auth-Dienst (nur fuer Aktivitaet,
          #    das Ergebnis ist egal)
          aufruf "REST-API" GET /rest/v1/
          aufruf "Auth"     GET /auth/v1/health

          if [ "${PING_STATUS}" = "200" ]; then
            echo "Keep-alive erfolgreich."
            exit 0
          fi

          case "${PING_STATUS}" in
            522|540|544|000)
              echo "::error::Supabase antwortet nicht (HTTP ${PING_STATUS}). Das Projekt ist sehr wahrscheinlich PAUSIERT. Im Supabase-Dashboard anmelden und 'Restore project' druecken. Keep-alive kann ein pausiertes Projekt NICHT wieder aufwecken."
              ;;
            401|403)
              echo "::error::Zugriff verweigert (HTTP ${PING_STATUS}). Secret SUPABASE_ANON_KEY pruefen."
              ;;
            404)
              echo "::error::Funktion ping() nicht gefunden (HTTP 404). Migrationen 0002/0010 im SQL-Editor ausfuehren."
              ;;
            *)
              echo "::error::Keep-alive fehlgeschlagen (HTTP ${PING_STATUS})."
              head -c 500 antwort.txt; echo
              ;;
          esac
          exit 1
